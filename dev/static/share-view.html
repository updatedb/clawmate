<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/png" sizes="32x32" href="./asset/clawmate-logo.png" />
  <link rel="apple-touch-icon" href="./asset/clawmate-logo.png" />
  <link rel="manifest" href="./manifest.json" />
  <title>分享 · ClawMate</title>
  <!-- Anti-flash: apply theme BEFORE first paint -->
  <script>
    (function(){try{var t=localStorage.getItem('clawmate-theme')||'auto';if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}else if(t==='auto'){if(window.matchMedia('(prefers-color-scheme:dark)').matches){document.documentElement.setAttribute('data-theme','dark');}}}catch(e){}})();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="highlight-theme-css" />
  <link rel="stylesheet" href="./vendor/github-markdown-dark.min.css" id="github-markdown-css" />
  <link rel="stylesheet" href="./vendor/katex.min.css" />
  <style>
    html, body { overflow: hidden; height: 100%; margin: 0; padding: 0; }

    /* ── Layout (mirrors preview.html) ── */
    .share-app {
      display: flex; flex-direction: column;
      height: 100%; overflow: hidden;
      position: relative;
    }
    .topbar {
      display: flex; align-items: center;
      padding: 0 16px; height: 48px; gap: 12px;
      background: var(--brand-bg); color: var(--brand-text);
      flex-shrink: 0; z-index: 10; border-bottom: 1px solid var(--border-color);
    }
    .topbar .brand { font-weight: 700; font-size: var(--font-size-lg); flex-shrink: 0; line-height: 1; height: 34px; display: inline-flex; align-items: center; gap: 8px; }
    .topbar .share-title {
      flex: 1; font-size: 14px; font-weight: 500;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      min-width: 0;
    }
    .topbar-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }

    /* ── Three-column (desktop) ── */
    .share-three-col {
      display: grid;
      grid-template-columns: 240px 1fr 0px;
      flex: 1; min-height: 0; overflow: hidden; width: 100%;
    }
    .share-left {
      border-right: 1px solid var(--border-color);
      background: var(--bg-secondary);
      display: flex; flex-direction: column; overflow: hidden;
      translate: 0;
      transition: translate var(--duration-slow, 0.3s) ease;
    }
    .share-left.hidden { translate: -100%; pointer-events: none; }
    .share-left-header {
      padding: 12px 16px 8px; border-bottom: 1px solid var(--border-color);
      flex-shrink: 0; font-size: 12px; font-weight: 700; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.5px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .share-left-header span { flex: 1; }
    .share-left-close {
      background: none; border: none; font-size: 16px; cursor: pointer;
      color: var(--text-secondary); padding: 2px 4px; line-height: 1; border-radius: 4px;
    }
    .share-left-close:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .share-left-body { flex: 1; overflow-y: auto; padding: 8px 0; }

    .share-center {
      display: flex; flex-direction: column; overflow: hidden;
      background: var(--bg-primary); flex: 1; min-height: 0; min-width: 0;
    }
    .share-center-body {
      flex: 1; overflow-y: auto; padding: 20px; min-width: 0;
    }

    /* ── TOC ── */
    .share-toc-list { list-style: none; margin: 0; padding: 0; }
    .share-toc-item { border-radius: 6px; cursor: pointer; }
    .share-toc-item a {
      display: block; padding: 5px 16px; color: var(--text-primary);
      text-decoration: none; border-radius: 6px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; font-size: 13px;
      transition: background 0.12s, color 0.12s;
    }
    .share-toc-item a:hover { background: var(--bg-tertiary); color: var(--accent); }
    .share-toc-item a.toc-active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
    .share-toc-item.toc-h1 a { padding-left: 16px; font-weight: 600; }
    .share-toc-item.toc-h2 a { padding-left: 28px; }
    .share-toc-item.toc-h3 a { padding-left: 40px; font-size: 12px; }
    .share-toc-item.toc-h4 a { padding-left: 52px; font-size: 12px; color: var(--text-secondary); }
    .share-toc-empty { color: var(--text-muted); font-size: 12px; padding: 20px 16px; text-align: center; }

    /* ── Bottombar ── */
    .share-bottombar {
      height: 40px; background: var(--brand-bg); color: var(--brand-text);
      display: flex; align-items: center; justify-content: center;
      padding: 0 16px; flex-shrink: 0; z-index: 10;
      font-size: 12px; opacity: 0.55;
    }

    /* ── Loading & media ── */
    .share-loading, .share-error { text-align: center; padding: 80px 20px; font-size: 14px; }
    .share-loading { color: var(--text-secondary); }
    .share-error { color: var(--danger); }
    .share-media { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px; }
    .share-media img { max-width: 100%; max-height: 70vh; border-radius: 8px; object-fit: contain; }
    .share-media video, .share-media audio { width: 100%; max-width: 600px; }
    .share-media video { max-height: 60vh; border-radius: 8px; background: #000; }
    .share-media audio { margin-top: 16px; }
    .share-media-title { text-align: center; font-size: 14px; color: var(--text-secondary); margin-bottom: 12px; word-break: break-all; }

    .markdown-body { background: transparent !important; }

    /* ── Feedback panel selection tooltip (创建反馈浮窗) ── */
    .share-sel-tooltip {
      position: fixed; z-index: 40; display: flex; flex-direction: column;
      width: 340px; max-width: calc(100vw - 20px);
      background: var(--bg-primary); color: var(--text-primary);
      border: 1px solid var(--border-color); border-radius: 10px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.18); padding: 10px; gap: 8px;
    }
    .share-sel-tooltip.hidden { display: none; }
    .share-sel-tooltip .pst-header {
      display: flex; align-items: center; gap: 6px; font-size: 12px;
      font-weight: 600; color: var(--text-primary);
    }
    .share-sel-tooltip .pst-header svg { width: 14px; height: 14px; }
    .share-sel-body { display: flex; flex-direction: column; gap: 6px; }
    .share-sel-selection {
      font-size: 11px; font-family: monospace; color: var(--text-secondary);
      background: var(--bg-code); border-radius: 4px; padding: 6px 8px;
      white-space: pre-wrap; word-break: break-all; max-height: 90px; overflow-y: auto;
    }
    .share-sel-note {
      width: 100%; box-sizing: border-box; resize: vertical; min-height: 60px;
      border: 1px solid var(--border-color); border-radius: 6px;
      background: var(--bg-code); color: var(--text-primary); padding: 8px;
      font-family: inherit; font-size: 12px;
    }
    .share-sel-actions { display: flex; gap: 6px; }
    .share-sel-actions .agent-panel-btn { height: 28px; padding: 0 9px; font-size: 12px; }
    .share-sel-actions .agent-panel-btn svg { width: 13px; height: 13px; }
    .share-sel-status { font-size: 11px; min-height: 12px; padding: 0; }
    .share-sel-status.ok { color: var(--success, #16a34a); }
    .share-sel-status.err { color: var(--danger); }

    /* ── Feedback panel (3-row layout: title / filter / list) ── */
    .share-right {
      position: absolute; top: 0; bottom: 0; right: 0;
      width: 380px; max-width: 92vw;
      background: var(--bg-primary); color: var(--text-primary);
      border-left: 1px solid var(--border-color);
      display: flex; flex-direction: column;
      z-index: 8; overflow: hidden;
      translate: 100%;
      transition: translate var(--duration-slow, 0.3s) ease;
    }
    .share-right.open {
      translate: 0 !important;
      box-shadow: -4px 0 24px rgba(0,0,0,0.18);
    }
    .share-right.hidden { translate: 100%; pointer-events: none; }
    .share-right-header {
      display: flex; align-items: center; gap: 6px;
      padding: 10px 12px; border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .share-right-header .srh-title {
      font-size: 14px; font-weight: 700; color: var(--text-primary);
      flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px;
    }
    .share-right-header .srh-spacer { flex: 1; }
    .share-right-header { gap: 8px; }
    .share-right-header .srh-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .share-right-actions {
      display: flex; align-items: center; gap: 6px;
      flex-shrink: 0; white-space: nowrap;
    }
    .share-right-actions .agent-panel-btn { height: 28px; padding: 0 9px; font-size: 12px; }
    .share-right-actions .agent-panel-btn svg { width: 13px; height: 13px; }
    .share-right-actions .agent-panel-btn.hidden { display: none; }
    .share-right-filter {
      display: flex; gap: 4px; padding: 8px 12px;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0; flex-wrap: nowrap; overflow-x: auto;
    }
    .share-right-filter .share-right-btn { flex-shrink: 0; }
    .share-right-body { flex: 1; overflow-y: auto; padding: 10px 12px; }
    .share-fb-empty {
      color: var(--text-muted); font-size: 12px; text-align: center;
      padding: 24px 10px; line-height: 1.6;
    }
    .share-fb-card {
      border: 1px solid var(--border-color); border-radius: 8px;
      padding: 10px; margin-bottom: 10px; background: var(--bg-secondary);
      font-size: 12px;
    }
    .share-fb-card-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .share-fb-card-meta {
      font-size: 11px; color: var(--text-muted); font-family: monospace; flex: 1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .share-fb-card-text {
      white-space: pre-wrap; word-break: break-word; line-height: 1.5;
      background: var(--bg-code); border-radius: 4px; padding: 6px 8px;
      max-height: 120px; overflow-y: auto; font-family: monospace;
    }
    .share-fb-card-note { margin-top: 6px; color: var(--text-secondary); }
    .share-fb-card-note strong { color: var(--text-primary); }
    .share-fb-del {
      background: none; border: none; color: var(--text-muted); cursor: pointer;
      font-size: 13px; padding: 2px 5px; border-radius: 4px; line-height: 1;
      flex-shrink: 0;
    }
    .share-fb-del:hover { background: var(--bg-tertiary); color: var(--danger); }
    .share-fb-position {
      width: 100%; box-sizing: border-box; border: 1px solid var(--border-color);
      border-radius: 6px; background: var(--bg-code); color: var(--text-primary);
      padding: 6px 8px; font-family: monospace; font-size: 11px; margin-bottom: 6px;
    }
    .share-fb-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
    .share-fb-tags .share-right-btn { padding: 2px 7px; font-size: 11px; font-weight: 400; }
    .share-fb-actions { display: flex; gap: 6px; margin-top: 8px; }
    .share-fb-cancelled {
      margin-top: 8px; font-size: 11px; color: var(--text-muted);
      border: 1px dashed var(--border-color); border-radius: 4px; padding: 4px 8px; text-align: center;
    }
    .share-fb-status { font-size: 12px; padding: 4px 12px 8px; min-height: 16px; }
    .share-fb-status.ok { color: var(--success, #16a34a); }
    .share-fb-status.err { color: var(--danger); }
    .share-right-btn {
      padding: 4px 9px; border-radius: 6px; border: 1px solid var(--border-color);
      background: var(--btn-bg); color: var(--btn-text); cursor: pointer;
      font-size: 12px; font-weight: 600; line-height: 1; white-space: nowrap;
      transition: background 0.12s, border-color 0.12s;
    }
    .share-right-btn:hover { background: var(--bg-secondary); border-color: var(--text-muted); }
    .share-right-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .share-right-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Mobile (≤768px) ── */
    @media (max-width: 768px) {
      .topbar { padding: 0 8px; gap: 6px; }
      .topbar .brand { font-size: 0; flex: none; opacity: 1; }
      .topbar-btn { width: 30px; height: 30px; font-size: 13px; }
      .share-three-col { grid-template-columns: 0px 1fr 0px !important; }
      .share-center { grid-column: 2 !important; }
      .share-center-body { padding: 12px; }
      .share-left { transition: none !important; translate: -100% !important; pointer-events: none !important; width: 0 !important; min-width: 0 !important; padding: 0 !important; border-width: 0 !important; overflow: hidden !important; }
      .share-left:not(.hidden) {
        position: fixed; top: 0; bottom: 0; left: 0; z-index: 7;
        display: flex; width: 100vw !important;
        padding: 48px 0 0 0 !important; border-right: 1px solid var(--border-color) !important;
        translate: 0 !important;
        pointer-events: auto !important; overflow-y: auto !important;
        box-shadow: 0 4px 24px rgba(0,0,0,0.25);
      }
    }
  </style>
</head>
<body>
  <div class="share-app">
    <!-- Topbar -->
    <header class="topbar">
      <span class="brand"><img src="./asset/clawmate-logo.png" alt="" width="28" height="28" style="flex-shrink:0;" />ClawMate</span>
      <span class="share-title" id="shareTitle">📄 加载中...</span>
      <div class="topbar-actions">
        <button class="topbar-btn" id="btnToggleToc" title="切换大纲">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg>
        </button>
        <button class="topbar-btn" id="btnShareFeedback" title="反馈">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button class="topbar-btn" id="themeToggle" title="切换主题">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>
      </div>
    </header>

    <!-- Three-column -->
    <div class="share-three-col" id="shareThreeCol">
      <aside class="share-left hidden" id="shareLeft">
        <div class="share-left-header"><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg> 大纲</span><button class="share-left-close" id="btnCloseToc" title="关闭大纲"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
        <div class="share-left-body" id="tocBody">
          <div class="share-toc-empty">非 Markdown，无大纲</div>
        </div>
      </aside>
      <main class="share-center">
        <div class="share-center-body" id="contentBody">
          <div class="share-loading">加载中...</div>
        </div>
      </main>
    </div>

    <!-- Feedback panel (3-row layout: title+actions / filter / list), mirrors review panel -->
    <aside class="share-right hidden" id="shareRight" aria-label="反馈面板">
      <div class="share-right-header">
        <span class="srh-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> 反馈</span>
        <span class="srh-spacer"></span>
        <div class="share-right-actions">
          <button class="agent-panel-btn" id="shareFbAdd" type="button" title="添加反馈"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg><span class="agent-panel-btn-label">添加反馈</span></button>
          <button class="agent-panel-btn" id="shareFbSubmit" type="button" title="提交评审"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg><span class="agent-panel-btn-label">提交评审</span></button>
          <button class="agent-panel-btn" id="shareFbClose" type="button" title="关闭面板"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>
      </div>
      <div class="share-right-filter" id="shareFbFilter">
        <button class="share-right-btn" data-share-filter="pending" title="待提交">待提交</button>
        <button class="share-right-btn" data-share-filter="submitted" title="已提交">已提交</button>
      </div>
      <div class="share-right-body" id="shareFbList">
        <div class="share-fb-empty">选中内容后点击「添加反馈」即可累积</div>
      </div>
      <div class="share-fb-status" id="shareFbStatus"></div>
    </aside>

    <!-- Selection tooltip (创建反馈浮窗) -->
    <div class="share-sel-tooltip hidden" id="shareSelTooltip">
      <div class="pst-header"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> 反馈选中内容</div>
      <div class="share-sel-body">
        <div class="share-sel-selection" id="shareSelText"></div>
        <textarea class="share-sel-note" id="shareSelNote" placeholder="简要说明改动需求（必填）" rows="3"></textarea>
      </div>
      <div class="share-sel-actions">
        <button class="agent-panel-btn" id="shareSelAdd"><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg><span class="agent-panel-btn-label">加入待办</span></button>
        <button class="agent-panel-btn" id="shareSelSend"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg><span class="agent-panel-btn-label">提交评审</span></button>
      </div>
      <div class="share-sel-status" id="shareSelStatus"></div>
    </div>

    <!-- Bottombar -->
    <div class="share-bottombar">
      <span id="shareExpiry">⏳ -</span>
    </div>
  </div>

  <script src="./vendor/purify.min.js"></script>
  <script src="./vendor/markdown-it.min.js"></script>
  <script src="./vendor/markdown-it-container.min.js"></script>
  <script src="./vendor/markdown-it-emoji.min.js"></script>
  <script src="./vendor/markdown-it-footnote.min.js"></script>
  <script src="./vendor/markdown-it-task-lists.min.js"></script>
  <script src="./vendor/highlight.min.js"></script>
  <script src="./vendor/katex.min.js"></script>
  <script src="./vendor/auto-render.min.js"></script>
  <script src="./vendor/mermaid-v11.min.js"></script>
  <script src="./js/icons.js"></script>
  <script src="./js/topbar.js"></script>
  <script src="./js/preview-common.js"></script>
  <script>
  (function() {
    'use strict';
    var params = new URLSearchParams(location.search);
    var TOKEN = params.get('token');
    if (!TOKEN) {
      document.getElementById('contentBody').innerHTML = '<div class="share-error">❌ 缺少分享令牌</div>';
      return;
    }

    const API_BASE = '/api/clawmate';
    const body = document.getElementById('contentBody');
    var mermaidStore = [];

    // ── Elements ──
    var tocBtn = document.getElementById('btnToggleToc');
    var shareLeft = document.getElementById('shareLeft');
    var threeCol = document.getElementById('shareThreeCol');
    var tocBody = document.getElementById('tocBody');

    function updateGrid() {
      var hidden = shareLeft.classList.contains('hidden');
      threeCol.style.gridTemplateColumns = (hidden ? '0px' : '240px') + ' 1fr 0px';
    }

    // ── Theme (icon + cycle handled by topbar.js; CSS updates via _onThemeChange) ──
    function _updateThemeAssets(resolved) {
      document.body.classList.toggle('dark', resolved === 'dark');
      document.getElementById('highlight-theme-css').href = resolved === 'dark'
        ? 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css'
        : 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
      document.getElementById('github-markdown-css').href = resolved === 'dark'
        ? './vendor/github-markdown-dark.min.css'
        : './vendor/github-markdown-light.min.css';
    }
    // Initial asset setup (topbar.js already applied data-theme before this script runs)
    var _initResolved = document.documentElement.getAttribute('data-theme') || 'light';
    _updateThemeAssets(_initResolved);
    // Hook for subsequent theme changes (topbar.js calls this on cycle/system-change)
    window._onThemeChange = function(resolved) {
      _updateThemeAssets(resolved);
    };

    // ── Slide animation helpers ──
    var _tocTransitioning = false;
    function _onTocTransitionEnd(e) {
      if (e.propertyName !== 'translate') return;
      shareLeft.removeEventListener('transitionend', _onTocTransitionEnd);
      _tocTransitioning = false;
      if (shareLeft.classList.contains('hidden')) {
        shareLeft.style.display = '';             // let global .hidden take over
        updateGrid();                             // grid column → 0px
      }
    }
    function hideTocInstant() {
      // Clean up any in-progress transition and hide immediately (no animation).
      // Used for non-markdown content and mobile heading clicks where a slide-out
      // animation is unnecessary.
      shareLeft.removeEventListener('transitionend', _onTocTransitionEnd);
      _tocTransitioning = false;
      shareLeft.style.display = '';
      shareLeft.classList.add('hidden');
      updateGrid();
      tocBtn.classList.remove('active');
    }
    function openToc() {
      if (!shareLeft.classList.contains('hidden') && !_tocTransitioning) return;
      // Clean up any in-progress close transition
      shareLeft.removeEventListener('transitionend', _onTocTransitionEnd);
      _tocTransitioning = false;
      shareLeft.style.display = 'flex';           // override global .hidden display:none
      // Expand grid column directly while panel is still "hidden"
      threeCol.style.gridTemplateColumns = '240px 1fr 0px';
      shareLeft.offsetHeight;                     // reflow: w=240, translateX(-240px)
      shareLeft.classList.remove('hidden');       // slide-in: -100% → 0
      shareLeft.style.display = '';
      tocBtn.classList.add('active');
    }
    function closeToc() {
      if (shareLeft.classList.contains('hidden') && !_tocTransitioning) return;
      shareLeft.style.display = 'flex';           // override global .hidden display:none
      shareLeft.addEventListener('transitionend', _onTocTransitionEnd);
      _tocTransitioning = true;
      shareLeft.classList.add('hidden');          // slide-out: 0 → -100%
      tocBtn.classList.remove('active');
    }

    // ── TOC toggle ──
    tocBtn.addEventListener('click', function() {
      if (shareLeft.classList.contains('hidden')) {
        openToc();
      } else {
        closeToc();
      }
    });
    tocBtn.classList.toggle('active', !shareLeft.classList.contains('hidden'));

    // ── TOC close button ──
    document.getElementById('btnCloseToc').addEventListener('click', function() {
      closeToc();
    });

    // ── Markdown renderer ──
    var md = window.markdownit({ html: true, linkify: true, typographer: true, breaks: true });
    md.use(window.markdownitContainer, 'note');
    md.use(window.markdownitContainer, 'warning');
    md.use(window.markdownitContainer, 'tip');
    md.use(window.markdownitEmoji);
    md.use(window.markdownitFootnote);
    md.use(window.markdownitTaskLists, { enabled: true, label: true, labelAfter: true });

    // Rewrite relative image paths → share asset endpoint
    var _shareRoot = '', _shareFile = '';
    md.renderer.rules.image = function(tokens, idx) {
      var token = tokens[idx];
      var src = token.attrGet('src') || '';
      var alt = token.content || '';
      var title = token.attrGet('title') || '';
      if (!/^https?:\/\//i.test(src) && !src.startsWith('/')) {
        var dir = _shareFile.includes('/') ? _shareFile.split('/').slice(0, -1).join('/') : '';
        var full = dir ? dir + '/' + src : src;
        src = API_BASE + '/share/' + TOKEN + '/asset?root=' + encodeURIComponent(_shareRoot) + '&path=' + encodeURIComponent(full);
      }
      return '<img src="' + src + '" alt="' + (alt || '') + '"' + (title ? ' title="' + title + '"' : '') + ' onerror="this.style.display=\'none\'">';
    };

    md.renderer.rules.fence = function(tokens, idx) {
      var token = tokens[idx];
      var language = token.info.trim();
      var raw = token.content;
      if (language === 'mermaid') {
        var id = mermaidStore.length;
        mermaidStore.push(raw);
        return '<div class="mermaid" data-mermaid-id="' + id + '"></div>';
      }
      var cls = language ? 'language-' + language : '';
      if (language) {
        try {
          var langMap = { yml:'yaml', node:'javascript', py:'python', sh:'bash', markdown:'md', text:'plaintext' };
          var nl = langMap[language.toLowerCase()] || language;
          if (window.hljs && window.hljs.getLanguage && window.hljs.getLanguage(nl)) {
            return '<pre><code class="' + cls + '">' + window.hljs.highlight(raw.replace(/<[^>]*>/g, ''), { language: nl, ignoreIllegals: true }).value + '</code></pre>';
          }
        } catch(e) {}
      }
      return '<pre><code class="' + cls + '">' + md.utils.escapeHtml(raw) + '</code></pre>';
    };

    // Rewrite relative markdown links to ClawMate preview URLs
    var _defaultLinkOpen = md.renderer.rules.link_open || function(tokens, idx, options, env, slf) {
      return slf.renderToken(tokens, idx, options);
    };
    md.renderer.rules.link_open = function(tokens, idx, options, env, slf) {
      var token = tokens[idx];
      var href = token.attrGet('href') || '';
      if (href && !/^https?:\/\//i.test(href) && !href.startsWith('/') && !href.startsWith('#')) {
        var dir = (_shareFile || '').includes('/') ? _shareFile.split('/').slice(0, -1).join('/') : '';
        var fullPath = dir ? dir + '/' + href : href;
        href = 'preview.html?root=' + encodeURIComponent(_shareRoot) + '&file=' + encodeURIComponent(fullPath);
        token.attrSet('href', href);
      }
      return _defaultLinkOpen(tokens, idx, options, env, slf);
    };

    function buildTOC(mdDiv) {
      var headings = mdDiv.querySelectorAll('h1,h2,h3,h4');
      if (headings.length < 2) {
        closeToc();
        return;
      }
      // Keep hidden by default on mobile
      if (window.innerWidth >= 768) {
        openToc();
        tocBtn.classList.add('active');
      }
      headings.forEach(function(heading, i) { if (!heading.id) heading.id = 'share-h-' + i; });
      var list = document.createElement('ul');
      list.className = 'share-toc-list';
      headings.forEach(function(heading) {
        var level = parseInt(heading.tagName[1]);
        var li = document.createElement('li');
        li.className = 'share-toc-item toc-h' + level;
        var a = document.createElement('a');
        a.href = '#' + heading.id;
        a.textContent = heading.textContent;
        a.addEventListener('click', function(ev) {
          ev.preventDefault();
          if (window.innerWidth < 768) { hideTocInstant(); }
          var ct = document.getElementById('contentBody');
          var hTop = heading.getBoundingClientRect().top;
          var cTop = ct.getBoundingClientRect().top;
          ct.scrollTo({ top: hTop - cTop + ct.scrollTop - 20, behavior: 'smooth' });
        });
        li.appendChild(a);
        list.appendChild(li);
      });
      tocBody.innerHTML = ''; tocBody.appendChild(list);

      // Active highlight via IntersectionObserver (one observer for all)
      if (typeof IntersectionObserver !== 'undefined' && headings.length) {
        var links = list.querySelectorAll('a');
        var activeLink = null;
        var observer = new IntersectionObserver(function(entries) {
          var visible = entries.filter(function(e) { return e.isIntersecting; })
            .sort(function(a, b) { return a.boundingClientRect.top - b.boundingClientRect.top; });
          if (visible.length) {
            var link = list.querySelector('a[href="#' + visible[0].target.id + '"]');
            if (link && link !== activeLink) {
              if (activeLink) activeLink.classList.remove('toc-active');
              link.classList.add('toc-active');
              activeLink = link;
            }
          }
        }, { rootMargin: '-10% 0px -80% 0px', threshold: 0 });
        headings.forEach(function(heading) { observer.observe(heading); });
      }
    }

    function renderMarkdown(content) {
      var html = md.render(content);
      body.innerHTML = '<div class="markdown-body">' + html + '</div>';
      var mdDiv = body.querySelector('.markdown-body');
      buildTOC(mdDiv);

      if (window.mermaid && mermaidStore.length) {
        try {
          var blocks = mdDiv.querySelectorAll('.mermaid');
          blocks.forEach(function(b) {
            var id = b.getAttribute('data-mermaid-id');
            if (id != null && mermaidStore[id]) b.textContent = mermaidStore[id];
          });
          window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: (window._topbarResolvedTheme && window._topbarResolvedTheme()) === 'dark' ? 'dark' : 'default' });
          window.mermaid.run({ querySelector: '.share-center .mermaid' }).catch(function(){});
        } catch(e) {}
      }
      if (window.renderMathInElement) {
        try { renderMathInElement(mdDiv, { delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}] }); } catch(e) {}
      }
      if (window.hljs && window.hljs.highlightElement) {
        mdDiv.querySelectorAll('pre code:not(.hljs)').forEach(function(b) { try { window.hljs.highlightElement(b); } catch(e) {} });
      }
      mdDiv.querySelectorAll('a[href^="http"]').forEach(function(a) {
        a.setAttribute('target', '_blank'); a.setAttribute('rel', 'noopener');
      });
      // Internal ClawMate links stay in same tab
      mdDiv.querySelectorAll('a[href*="preview.html?root="]').forEach(function(a) {
        a.setAttribute('target', '_self');
      });
    }

    function renderPlainText(content) {
      var pre = document.createElement('pre');
      pre.style.cssText = 'margin:0;padding:16px;overflow-x:auto;font-size:14px;white-space:pre-wrap;word-break:break-word;border-radius:8px;background:var(--bg-code);color:var(--text-primary);';
      pre.textContent = content;
      body.innerHTML = ''; body.appendChild(pre);
    }

    // ── Feedback panel (share surface) ───────────────────────────────
    // Public share has feedback only: add a selection, then submit. It
    // deliberately exposes no review/task/file-tree API or controls. The
    // panel mirrors the review panel: 3-row layout, editable cards with
    // 定位/建议/操作, and a selection tooltip with 加入待办 / 提交评审.
    var shareRight = document.getElementById('shareRight');
    var shareFbBody = document.getElementById('shareFbList');
    var shareFbStatusEl = document.getElementById('shareFbStatus');
    var shareSelTooltip = document.getElementById('shareSelTooltip');
    var shareSelText = document.getElementById('shareSelText');
    var shareSelNote = document.getElementById('shareSelNote');
    var shareSelStatus = document.getElementById('shareSelStatus');
    var sharePending = [];   // { id, position, text, note, action, scope }
    var shareSubmitted = []; // same shape, submitted/已提交
    var _shareFbId = 0;
    var shareFbFilter = 'pending';
    var _shareAuthor = '';
    var _shareSelSavedText = '';

    function _shareEsc(s) { var d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }
    function _shareFbStatus(msg, ok) { shareFbStatusEl.textContent = msg || ''; shareFbStatusEl.className = 'share-fb-status' + (ok ? ' ok' : msg ? ' err' : ''); }
    function _shareSelRenderStatus(msg, ok) { shareSelStatus.textContent = msg || ''; shareSelStatus.className = 'share-sel-status' + (ok ? ' ok' : msg ? ' err' : ''); }
    function _shareGetSelection() {
      var sel = window.getSelection ? window.getSelection().toString() : '';
      return String(sel || '').trim();
    }
    function _shareActiveFilter() {
      var btns = shareRight.querySelectorAll('[data-share-filter]');
      btns.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-share-filter') === shareFbFilter); });
    }

    // Editable feedback card (定位/建议/操作), mirrors review-panel pending card.
    function _shareBuildCard(it) {
      var card = document.createElement('div');
      card.className = 'share-fb-card';

      // head: meta + X delete (待提交 removes locally; 已提交 marks deleted)
      var head = document.createElement('div'); head.className = 'share-fb-card-head';
      var meta = document.createElement('span'); meta.className = 'share-fb-card-meta';
      meta.textContent = it.id + (it.position ? ' · Line ' + it.position : '');
      var del = document.createElement('button'); del.className = 'share-fb-del'; del.textContent = '✕'; del.title = '删除';
      del.addEventListener('click', function(e) {
        e.stopPropagation();
        // share surface is local-only: remove without recording. Real deleted
        // status/cancelled display lives in the review panel (已执行 list).
        if (shareFbFilter === 'pending') {
          sharePending = sharePending.filter(function(i){ return i.id !== it.id; });
        } else {
          shareSubmitted = shareSubmitted.filter(function(i){ return i.id !== it.id; });
        }
        _shareRender();
      });
      head.appendChild(meta); head.appendChild(del);
      card.appendChild(head);

      // 定位 (editable in 待提交)
      var pos = document.createElement('input'); pos.type='text'; pos.className='share-fb-position';
      pos.value = it.position || '';
      pos.placeholder = 'Line {start}-{end} — 定位';
      pos.addEventListener('input', function(){ it.position = pos.value; });
      pos.addEventListener('click', function(e){ e.stopPropagation(); });
      card.appendChild(pos);

      // 选中内容 preview
      var text = document.createElement('textarea'); text.className = 'share-fb-card-text';
      text.value = it.text || ''; text.rows = 2;
      text.placeholder = '选中内容';
      text.addEventListener('input', function(){ it.text = text.value; });
      text.addEventListener('click', function(e){ e.stopPropagation(); });
      card.appendChild(text);

      // 建议 (editable in 待提交)
      var note = document.createElement('textarea'); note.className = 'share-fb-card-note';
      note.value = it.note || ''; note.rows = 3;
      note.placeholder = '<必填>简要说明改动需求';
      note.addEventListener('input', function(){ it.note = note.value; });
      note.addEventListener('click', function(e){ e.stopPropagation(); });
      card.appendChild(note);

      // 操作 tag group (edit in 待提交)
      var tagRow = document.createElement('div'); tagRow.className = 'share-fb-tags';
      [['修改','modify'],['删除','delete'],['扩展','explain'],['简化','simplify']].forEach(function(p){
        var b = document.createElement('button'); b.className = 'share-right-btn';
        b.textContent = p[0];
        if (it.action === p[1]) b.classList.add('active');
        b.addEventListener('click', function(e){
          e.stopPropagation();
          it.action = p[1]; it.scope = 'document';
          _shareRender();
        });
        tagRow.appendChild(b);
      });
      card.appendChild(tagRow);

      // 提交评审 button (待提交 only)
      if (shareFbFilter === 'pending') {
        var actions = document.createElement('div'); actions.className = 'share-fb-actions';
        var submit = document.createElement('button'); submit.className = 'share-right-btn';
        submit.textContent = '提交评审';
        submit.addEventListener('click', function(e){
          e.stopPropagation();
          if (submit.disabled) return;
          if (!it.note || !it.note.trim()) { _shareFbStatus('请填写建议（必填）', false); return; }
          if (!it.action) it.action = 'modify';
          submit.disabled = true;
          _shareSubmitPending([it]).finally(function(){ submit.disabled = false; });
        });
        actions.appendChild(submit);
        card.appendChild(actions);
      }
      return card;
    }

    function _shareRender() {
      shareFbBody.innerHTML = '';
      var source = shareFbFilter === 'pending' ? sharePending : shareSubmitted;
      if (!source.length) {
        var empty = document.createElement('div');
        empty.className = 'share-fb-empty';
        empty.textContent = shareFbFilter === 'pending' ? '选中内容后点击浮窗「加入待办」即可累积' : '暂无已提交反馈';
        shareFbBody.appendChild(empty);
      }
      source.forEach(function(it) { shareFbBody.appendChild(_shareBuildCard(it)); });
      _shareActiveFilter();
    }

    function openShareFeedback() { shareRight.classList.remove('hidden'); shareRight.classList.add('open'); }
    function closeShareFeedback() { shareRight.classList.add('hidden'); shareRight.classList.remove('open'); }
    function toggleShareFeedback() {
      if (shareRight.classList.contains('hidden')) openShareFeedback();
      else closeShareFeedback();
    }
    document.getElementById('btnShareFeedback').addEventListener('click', toggleShareFeedback);
    document.getElementById('shareFbClose').addEventListener('click', closeShareFeedback);

    // Filter
    shareRight.querySelectorAll('[data-share-filter]').forEach(function(b) {
      b.addEventListener('click', function() { shareFbFilter = b.getAttribute('data-share-filter'); _shareRender(); });
    });

    // 加入待办 (tooltip) → pending card
    document.getElementById('shareSelAdd').addEventListener('click', function() {
      var sel = _shareSelSavedText;
      var note = shareSelNote.value.trim();
      if (!sel) { _shareSelRenderStatus('请先选中内容', false); return; }
      if (!note) { _shareSelRenderStatus('请填写建议', false); shareSelNote.focus(); return; }
      sharePending.push({ id: 'FD-' + (++_shareFbId), position: '', text: sel.slice(0,800), note: note, action: 'modify', scope: 'document' });
      shareSelNote.value = ''; _shareSelRenderStatus('');
      shareSelTooltip.classList.add('hidden');
      shareFbFilter = 'pending'; openShareFeedback(); _shareRender();
      _shareFbStatus('✅ 已加入待办', true);
    });

    // 提交评审 (tooltip) → directly submit this selection
    document.getElementById('shareSelSend').addEventListener('click', function() {
      var sel = _shareSelSavedText;
      var note = shareSelNote.value.trim();
      if (!sel) { _shareSelRenderStatus('请先选中内容', false); return; }
      if (!note) { _shareSelRenderStatus('请填写建议', false); shareSelNote.focus(); return; }
      var item = { id: 'FD-' + (++_shareFbId), position: '', text: sel.slice(0,800), note: note, action: 'modify', scope: 'document' };
      shareSelNote.value = ''; _shareSelRenderStatus('');
      _shareSubmitPending([item]);
    });

    // 面板「添加反馈」→ hint user to select text
    document.getElementById('shareFbAdd').addEventListener('click', function() {
      shareFbFilter = 'pending'; openShareFeedback(); _shareRender();
      _shareFbStatus('请先在正文中选中内容，再点浮窗「加入待办」', false);
    });

    // 面板「提交评审」→ submit all pending
    document.getElementById('shareFbSubmit').addEventListener('click', function() {
      if (!sharePending.length) { _shareFbStatus('暂无待提交反馈', false); return; }
      _shareSubmitPending(sharePending.slice());
    });

    async function _shareSubmitPending(list) {
      var btn = document.getElementById('shareFbSubmit'); if (btn) btn.disabled = true;
      _shareFbStatus('提交中...', false);
      try {
        var payload = { author: _shareAuthor, selections: list.map(function(it) {
          return { text: it.text, note: it.note, action: it.action || 'modify', position: it.position || '' };
        }) };
        var response = await fetch(API_BASE + '/share/' + TOKEN + '/feedback', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
        var data = await response.json();
        if (!response.ok) throw new Error(data.detail || '提交失败');
        var ids = data.ids || [];
        // Move the successfully submitted items from pending → submitted
        var pendingIds = new Set(list.map(function(it){ return it.id; }));
        shareSubmitted = shareSubmitted.concat(sharePending.filter(function(it){ return pendingIds.has(it.id); })
          .map(function(it){ var c = Object.assign({}, it); c.id = ids[shareSubmitted.length] || it.id; return c; }));
        sharePending = sharePending.filter(function(it){ return !pendingIds.has(it.id); });
        shareFbFilter = 'submitted';
        _shareRender();
        _shareFbStatus('✅ 已提交评审（' + list.length + ' 条）', true);
      } catch (err) {
        _shareFbStatus('❌ ' + err.message, false);
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    // Selection tooltip logic (mirror review-panel text selection)
    function _handleShareSelection() {
      var sel = _shareGetSelection();
      if (!sel) { shareSelTooltip.classList.add('hidden'); return; }
      _shareSelSavedText = sel;
      shareSelText.textContent = sel.length > 600 ? sel.slice(0,600)+'…' : sel;
      shareSelNote.value = ''; _shareSelRenderStatus('');
      // position tooltip near selection
      var rect = null;
      try { var s = window.getSelection(); if (s.rangeCount) rect = s.getRangeAt(0).getBoundingClientRect(); } catch(e){}
      if (rect) {
        var top = rect.bottom + 8;
        var left = rect.left + rect.width/2;
        shareSelTooltip.style.maxWidth = Math.min(400, window.innerWidth - 20) + 'px';
        shareSelTooltip.classList.remove('hidden');
        requestAnimationFrame(function(){
          var h = shareSelTooltip.offsetHeight, w = shareSelTooltip.offsetWidth;
          if (top + h > window.innerHeight - 10) top = rect.top - h - 8;
          left = Math.max(10 + w/2, Math.min(window.innerWidth - 10 - w/2, left));
          shareSelTooltip.style.top = top + 'px';
          shareSelTooltip.style.left = left + 'px';
          shareSelTooltip.style.transform = 'translateX(-50%)';
        });
      } else {
        shareSelTooltip.classList.remove('hidden');
        shareSelTooltip.style.top = '80px'; shareSelTooltip.style.left = '50%';
        shareSelTooltip.style.transform = 'translateX(-50%)';
      }
    }
    document.addEventListener('mouseup', function(e) {
      var sel = _shareGetSelection();
      if (sel) { setTimeout(_handleShareSelection, 10); }
      else if (!shareSelTooltip.contains(e.target)) { shareSelTooltip.classList.add('hidden'); }
    });
    shareSelTooltip.addEventListener('click', function(e){ e.stopPropagation(); });

    // Author field (optional, local session)
    (function() {
      var v = '';
      try { v = (localStorage.getItem('clawmate-share-author') || '').trim(); } catch (e) {}
      _shareAuthor = v;
    })();

    _shareRender();

    async function loadContent() {
      try {
        var res = await fetch(API_BASE + '/share/' + TOKEN + '/data');
        if (!res.ok) {
          body.innerHTML = '<div class="share-error">❌ ' + (res.status === 410 ? '链接已过期' : '加载失败 (' + res.status + ')') + '</div>';
          return;
        }
        var data = await res.json();
        // Store root/file for image path rewriting
        _shareRoot = data.root || '';
        _shareFile = data.path || '';
        document.getElementById('shareExpiry').textContent = data.expires_str ? '⏳ ' + data.expires_str + ' 前有效' : '⏳ -';

        var ext = data.suffix ? data.suffix.replace('.','').toLowerCase() : '';
        var pageTitle = data.name;
        if ((ext === 'md' || ext === 'markdown') && data.content) {
          var m = data.content.match(/^#\s+(.+)$/m);
          if (m) pageTitle = m[1].trim();
        }
        document.title = pageTitle + ' · ClawMate 分享';
        document.getElementById('shareTitle').textContent = pageTitle;

        var IMG = ['png','jpg','jpeg','svg','webp','gif','bmp','ico'];
        var AUD = ['mp3','wav','ogg','flac','aac','m4a','wma'];
        var VID = ['mp4','webm','mov','avi','mkv','wmv','flv','m4v'];
        var DOC = ['doc','docx','xls','xlsx','ppt','pptx','odt','ods','odp','pdf'];

        if (IMG.includes(ext)) {
          hideTocInstant();
          body.innerHTML = '<div class="share-media"><div class="share-media-title">' + data.name + '</div><img src="' + API_BASE + '/share/' + TOKEN + '/raw" alt="' + data.name + '" /></div>';
        } else if (AUD.includes(ext)) {
          hideTocInstant();
          body.innerHTML = '<div class="share-media"><div class="share-media-title">' + data.name + '</div><audio src="' + API_BASE + '/share/' + TOKEN + '/raw" controls preload="metadata" style="width:100%;max-width:600px;"></audio></div>';
        } else if (VID.includes(ext)) {
          hideTocInstant();
          body.innerHTML = '<div class="share-media"><div class="share-media-title">' + data.name + '</div><video src="' + API_BASE + '/share/' + TOKEN + '/raw" controls preload="metadata" style="width:100%;max-height:60vh;border-radius:8px;background:#000;"></video></div>';
        } else if (DOC.includes(ext)) {
          hideTocInstant();
          body.innerHTML = '<div class="share-media" style="gap:16px;"><div style="font-size:48px;opacity:0.5;">📄</div><div class="share-media-title">' + data.name + '</div><div style="font-size:13px;color:var(--text-muted);">桌面版可预览 Office/PDF 文件</div></div>';
        } else if (ext === 'md' || ext === 'markdown') {
          renderMarkdown(data.content || '');
        } else if (ext === 'html' || ext === 'htm') {
          hideTocInstant();
          var iframe = document.createElement('iframe');
          iframe.style.cssText = 'width:100%;height:100%;border:none;background:#fff;';
          iframe.srcdoc = data.content || '';
          body.innerHTML = '';
          body.appendChild(iframe);
        } else {
          hideTocInstant();
          renderPlainText(data.content || '');
        }
      } catch(e) {
        body.innerHTML = '<div class="share-error">❌ 加载出错: ' + e.message + '</div>';
      }
    }
    loadContent();
  })();
  </script>
</body>
</html>
