<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/png" sizes="32x32" href="./asset/clawmate-logo.png" />
  <link rel="apple-touch-icon" href="./asset/clawmate-logo.png" />
  <link rel="manifest" href="./manifest.json" />
  <title>分享 · ClawMate</title>
  <!-- Anti-flash: apply theme BEFORE first paint -->
  <script>
    (function(){try{var t=localStorage.getItem('clawmate-theme')||'auto';if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}else if(t==='auto'){if(window.matchMedia('(prefers-color-scheme:dark)').matches){document.documentElement.setAttribute('data-theme','dark');}}}catch(e){}})();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/preview.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="highlight-theme-css" />
  <link rel="stylesheet" href="./vendor/github-markdown-dark.min.css" id="github-markdown-css" />
  <link rel="stylesheet" href="./vendor/katex.min.css" />
  <style>
    html, body { overflow: hidden; height: 100%; margin: 0; padding: 0; }

    /* ── Layout (mirrors preview.html) ── */
    .share-app {
      display: flex; flex-direction: column;
      height: 100%; overflow: hidden;
      position: relative;
    }
    .topbar {
      display: flex; align-items: center;
      padding: 0 16px; height: 48px; gap: 12px;
      background: var(--brand-bg); color: var(--brand-text);
      flex-shrink: 0; z-index: 10; border-bottom: 1px solid var(--border-color);
    }
    .topbar .brand { font-weight: 700; font-size: var(--font-size-lg); flex-shrink: 0; line-height: 1; height: 34px; display: inline-flex; align-items: center; gap: 8px; }
    .topbar .share-title {
      flex: 1; font-size: 14px; font-weight: 500;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      min-width: 0;
    }
    .topbar-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }

    /* ── Three-column (desktop) ── */
    .share-three-col {
      display: grid;
      grid-template-columns: 240px 1fr 0px;
      flex: 1; min-height: 0; overflow: hidden; width: 100%;
    }
    .share-left {
      grid-column: 1;
      border-right: 1px solid var(--border-color);
      background: var(--bg-secondary);
      display: flex; flex-direction: column; overflow: hidden;
      translate: 0;
      transition: translate var(--duration-slow, 0.3s) ease;
    }
    .share-left.hidden { translate: -100%; pointer-events: none; }
    .share-left-header {
      padding: 0 16px; height: 40px; box-sizing: border-box; border-bottom: 1px solid var(--border-color);
      flex-shrink: 0; font-size: 12px; font-weight: 700; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.5px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .share-left-header span { flex: 1; }
    .share-left-body { flex: 1; overflow-y: auto; padding: 8px 0; }

    .share-center {
      grid-column: 2;
      display: flex; flex-direction: column; overflow: hidden;
      background: var(--bg-primary); flex: 1; min-height: 0; min-width: 0;
    }
    .share-center-body {
      flex: 1; overflow-y: auto; padding: 20px; min-width: 0;
    }

    /* ── TOC ── */
    .share-toc-list { list-style: none; margin: 0; padding: 0; }
    .share-toc-item { border-radius: 6px; cursor: pointer; }
    .share-toc-item a {
      display: block; padding: 5px 16px; color: var(--text-primary);
      text-decoration: none; border-radius: 6px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; font-size: 13px;
      transition: background 0.12s, color 0.12s;
    }
    .share-toc-item a:hover { background: var(--bg-tertiary); color: var(--accent); }
    .share-toc-item a.toc-active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
    .share-toc-item.toc-h1 a { padding-left: 16px; font-weight: 600; }
    .share-toc-item.toc-h2 a { padding-left: 28px; }
    .share-toc-item.toc-h3 a { padding-left: 40px; font-size: 12px; }
    .share-toc-item.toc-h4 a { padding-left: 52px; font-size: 12px; color: var(--text-secondary); }
    .share-toc-empty { color: var(--text-muted); font-size: 12px; padding: 20px 16px; text-align: center; }

    /* ── Bottombar ── */
    .share-bottombar {
      height: 40px; background: var(--brand-bg); color: var(--text-muted);
      display: flex; align-items: center; justify-content: center;
      padding: 0 16px; flex-shrink: 0; z-index: 10;
      font-size: 12px; border-top: 1px solid var(--border-color);
    }

    /* ── Loading & media ── */
    .share-loading, .share-error { text-align: center; padding: 80px 20px; font-size: 14px; }
    .share-loading { color: var(--text-secondary); }
    .share-error { color: var(--text-primary); max-width: 360px; margin: 80px auto; padding: 24px; border: 1px solid var(--danger-border); border-radius: var(--radius-md); background: var(--danger-bg); line-height: 1.6; }
    .share-error strong { display: block; color: var(--danger); margin-bottom: 4px; }
    .share-media { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px; }
    .share-media img { max-width: 100%; max-height: 70vh; border-radius: 8px; object-fit: contain; }
    .share-media video, .share-media audio { width: 100%; max-width: 600px; }
    .share-media video { max-height: 60vh; border-radius: 8px; background: #000; }
    .share-media audio { margin-top: 16px; }
    .share-media-title { text-align: center; font-size: 14px; color: var(--text-secondary); margin-bottom: 12px; word-break: break-all; }

    .markdown-body { background: transparent !important; }

    /* ── Accessibility: keyboard focus + status regions (share-scoped) ── */
    .topbar-btn:focus-visible,
    .panel-close-btn:focus-visible,
    .preview-bottom-btn:focus-visible,
    .pst-btn-add:focus-visible,
    .pst-btn-send:focus-visible,
    .pst-tag:focus-visible,
    .fb-btn-delete:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 1px;
    }

    /* ── Feedback panel: reuses preview-right + fb-card styles from preview.css ──
     * Only local layout (slide-in position) and the small status line are
     * defined here; everything else is shared with the review panel. */
    .share-right {
      grid-column: 3;
      background: var(--bg-primary); color: var(--text-primary);
      border-left: 1px solid var(--border-color);
      display: flex; flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    .share-right.hidden { pointer-events: none; }
    .share-right .preview-right-header { padding: 10px 12px; }
    .share-right .preview-right-filter { padding: 8px 12px; }
    .share-right .preview-right-body { padding: 0; min-height: 0; }
    .share-right .fb-card-list { padding: 10px 12px 8px; }
    /* 分享页浮窗需在所有视口可用。preview.css 的移动端规则用 !important 隐藏
       .preview-selection-tooltip，这里以更高优先级 + !important 覆盖，只认 .hidden。 */
    .preview-selection-tooltip { display: none !important; }
    .preview-selection-tooltip.hidden { display: none !important; }
    .preview-selection-tooltip:not(.hidden) { display: flex !important; }
    .share-fb-status { font-size: 12px; padding: 4px 12px 8px; min-height: 16px; }
    .share-fb-status.ok { color: var(--success, #16a34a); }
    .share-fb-status.err { color: var(--danger); }

    /* ── Mobile drawer scrim: dims content behind an open drawer; tapped to close.
       Hidden by default and never active on desktop (pointer-events:none). */
    .share-drawer-scrim {
      position: fixed; inset: 0; z-index: 6;
      background: rgba(15, 23, 42, 0.35);
      opacity: 0; pointer-events: none;
      transition: opacity var(--duration-base) var(--ease-out);
    }

    /* ── Content-first responsive panel auto-hide ──
     * Rule 1a: when left+right panels would exceed the content width, hide the
     * right panel so content stays wide. Mobile (≤768px) already hides both. */
    @media (max-width: 1240px) and (min-width: 769px) {
      /* Content-first: grid columns are driven by updateGrid() (left collapses when
         hidden, feedback holder col stays 0 on narrow screens). The open feedback
         panel becomes a bounded overlay drawer over the full-width content. */
      .share-right:not(.hidden) {
        position: fixed;
        top: 0; bottom: 0; right: 0;
        z-index: 7;
        display: flex;
        flex-direction: column;
        width: min(420px, 86vw) !important;
        max-width: 86vw;
        padding: 48px 0 0 0;
        border-left: 1px solid var(--border-color) !important;
        overflow-y: auto;
        pointer-events: auto;
        box-shadow: var(--shadow-card-h);
      }
      /* Scrim dims content behind the open feedback drawer; tap to dismiss. */
      .share-app:has(.share-right:not(.hidden)) .share-drawer-scrim {
        opacity: 1; pointer-events: auto;
      }
    }

    /* ── Mobile (≤768px) ── */
    @media (max-width: 768px) {
      .topbar { padding: 0 8px; gap: 6px; }
      .topbar .brand { font-size: 0; flex: none; opacity: 1; }
      .topbar-btn { width: 30px; height: 30px; font-size: 13px; }
      .share-three-col { grid-template-columns: 0px 1fr 0px !important; }
      .share-center { grid-column: 2 !important; }
      .share-center-body { padding: 12px; }
      .share-left { transition: none !important; translate: -100% !important; pointer-events: none !important; width: 0 !important; min-width: 0 !important; padding: 0 !important; border-width: 0 !important; overflow: hidden !important; }
      .share-left:not(.hidden) {
        position: fixed; top: 0; bottom: 0; left: 0; z-index: 7;
        display: flex; width: min(312px, 86vw) !important; max-width: 86vw;
        padding: 48px 0 0 0 !important; border-right: 1px solid var(--border-color) !important;
        translate: 0 !important;
        pointer-events: auto !important; overflow-y: auto !important;
        box-shadow: var(--shadow-card-h);
      }
      /* Right feedback panel: same bounded drawer, from the right edge. */
      .share-right {
        transition: none !important; translate: 100% !important; pointer-events: none !important;
        width: 0 !important; min-width: 0 !important; padding: 0 !important;
        border-width: 0 !important; overflow: hidden !important;
      }
      .share-right:not(.hidden) {
        position: fixed; top: 0; bottom: 0; right: 0; z-index: 7;
        display: flex; flex-direction: column;
        width: min(312px, 86vw) !important; max-width: 86vw;
        padding: 48px 0 0 0 !important; border-left: 1px solid var(--border-color) !important;
        translate: 0 !important;
        pointer-events: auto !important; overflow-y: auto !important;
        box-shadow: var(--shadow-card-h);
      }
      /* Show the scrim whenever a drawer is open on mobile (content stays behind). */
      .share-app:has(.share-left:not(.hidden)) .share-drawer-scrim,
      .share-app:has(.share-right:not(.hidden)) .share-drawer-scrim {
        opacity: 1; pointer-events: auto;
      }
    }
  </style>
</head>
<body>
  <div class="share-app">
    <!-- Topbar -->
    <header class="topbar">
      <span class="brand"><img src="./asset/clawmate-logo.png" alt="" width="28" height="28" style="flex-shrink:0;" />ClawMate</span>
      <span class="share-title" id="shareTitle">📄 加载中...</span>
      <div class="topbar-actions">
        <button class="topbar-btn" id="btnToggleToc" title="切换大纲" aria-label="切换大纲">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg>
        </button>
        <button class="topbar-btn" id="btnShareFeedback" title="打开反馈" aria-pressed="false" aria-label="反馈">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button class="topbar-btn" id="themeToggle" title="切换主题" aria-label="切换主题">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>
      </div>
    </header>

    <!-- Three-column -->
    <div class="share-three-col" id="shareThreeCol">
      <aside class="share-left hidden" id="shareLeft">
        <div class="share-left-header"><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg> 大纲</span><button class="panel-close-btn" id="btnCloseToc" title="关闭大纲" aria-label="关闭大纲"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
        <nav class="share-left-body" id="tocBody" aria-label="目录大纲">
          <div class="share-toc-empty">非 Markdown，无大纲</div>
        </nav>
      </aside>
      <main class="share-center">
        <div class="share-center-body" id="contentBody">
          <div class="share-loading" role="status">加载中...</div>
        </div>
      </main>
      <aside class="share-right preview-right-col hidden" id="shareRight" aria-label="反馈面板">
        <div class="preview-right-header">
          <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> 反馈</span>
          <div class="preview-right-actions">
            <button class="agent-panel-btn" id="shareFbAdd" type="button" title="添加反馈"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg><span class="agent-panel-btn-label">添加反馈</span></button>
            <button class="agent-panel-btn" id="shareFbSubmit" type="button" title="提交评审"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg><span class="agent-panel-btn-label">提交评审</span></button>
            <button class="panel-close-btn" id="shareFbClose" type="button" title="关闭面板" aria-label="关闭面板"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
          </div>
        </div>
        <div class="preview-right-filter" id="shareFbFilter">
          <button class="preview-bottom-btn" data-share-filter="pending" title="待提交">待提交</button>
          <button class="preview-bottom-btn" data-share-filter="submitted" title="已提交">已提交</button>
        </div>
        <div class="preview-right-body" id="shareFbList">
          <div class="fb-card-list" id="shareFbCardList"></div>
        </div>
        <div class="share-fb-status" id="shareFbStatus" aria-live="polite" aria-atomic="true"></div>
      </aside>
    </div>

    <!-- Mobile drawer scrim (tap to dismiss an open TOC/feedback drawer) -->
    <div class="share-drawer-scrim" id="shareScrim" aria-hidden="true"></div>

    <!-- Selection tooltip (创建反馈浮窗): reuses preview-selection-tooltip structure -->
    <div class="preview-selection-tooltip hidden" id="shareSelTooltip">
      <div class="pst-header"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> 反馈选中内容</div>
      <div class="pst-location-row">
        <input type="text" id="shareSelLocation" class="pst-location" placeholder="位置：Line 或选择后识别" aria-label="反馈定位" style="flex:1;" />
      </div>
      <textarea class="pst-note" id="shareSelNote" placeholder="必填 · 简要说明需要的改动" aria-label="反馈建议" rows="3"></textarea>
      <div class="pst-tags" id="shareSelTags"></div>
      <div class="pst-actions">
        <button class="pst-btn-add" id="shareSelAdd"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg> 加入待办</button>
        <button class="pst-btn-send" id="shareSelSend"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg> 提交评审</button>
      </div>
      <div class="pst-status" id="shareSelStatus"></div>
    </div>

    <!-- Bottombar -->
    <div class="share-bottombar">
      <span id="shareExpiry">⏳ -</span>
    </div>
  </div>

  <script src="./vendor/purify.min.js"></script>
  <script src="./vendor/markdown-it.min.js"></script>

  <script>
  (function() {
    'use strict';
    var params = new URLSearchParams(location.search);
    var TOKEN = params.get('token');
    if (!TOKEN) {
      document.getElementById('contentBody').innerHTML = '<div class="share-error"><strong>缺少分享令牌</strong>请向发送者索取新的分享链接。</div>';
      return;
    }

    const API_BASE = '/api/clawmate';
    const body = document.getElementById('contentBody');
    var mermaidStore = [];

    // ── Elements ──
    var tocBtn = document.getElementById('btnToggleToc');
    var shareLeft = document.getElementById('shareLeft');
    var threeCol = document.getElementById('shareThreeCol');
    var tocBody = document.getElementById('tocBody');

    function updateGrid() {
      var hidden = shareLeft.classList.contains('hidden');
      var fbOpen = !shareRight.classList.contains('hidden');
      var vw = window.innerWidth;
      var lW = hidden ? '0px' : '240px';
      // Content-first: on narrow screens (≤1240) an open feedback panel becomes a
      // bounded overlay drawer (CSS makes it fixed), so keep col3 at 0 and let content
      // stay full-width behind it. Desktop (≥1241) keeps the panel beside content.
      var fbCol = (fbOpen && vw <= 1240) ? '0px' : (fbOpen ? '380px' : '0px');
      threeCol.style.gridTemplateColumns = lW + ' 1fr ' + fbCol;
    }

    // ── Theme (icon + cycle handled by topbar.js; CSS updates via _onThemeChange) ──
    function _updateThemeAssets(resolved) {
      document.body.classList.toggle('dark', resolved === 'dark');
      document.getElementById('highlight-theme-css').href = resolved === 'dark'
        ? 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css'
        : 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
      document.getElementById('github-markdown-css').href = resolved === 'dark'
        ? './vendor/github-markdown-dark.min.css'
        : './vendor/github-markdown-light.min.css';
    }
    // Initial asset setup (topbar.js already applied data-theme before this script runs)
    var _initResolved = document.documentElement.getAttribute('data-theme') || 'light';
    _updateThemeAssets(_initResolved);
    // Hook for subsequent theme changes (topbar.js calls this on cycle/system-change)
    window._onThemeChange = function(resolved) {
      _updateThemeAssets(resolved);
    };

    // ── Slide animation helpers ──
    var _tocTransitioning = false;
    function _onTocTransitionEnd(e) {
      if (e.propertyName !== 'translate') return;
      shareLeft.removeEventListener('transitionend', _onTocTransitionEnd);
      _tocTransitioning = false;
      if (shareLeft.classList.contains('hidden')) {
        shareLeft.style.display = '';             // let global .hidden take over
        updateGrid();                             // grid column → 0px
      }
    }
    function hideTocInstant() {
      // Clean up any in-progress transition and hide immediately (no animation).
      // Used for non-markdown content and mobile heading clicks where a slide-out
      // animation is unnecessary.
      shareLeft.removeEventListener('transitionend', _onTocTransitionEnd);
      _tocTransitioning = false;
      shareLeft.style.display = '';
      shareLeft.classList.add('hidden');
      updateGrid();
      tocBtn.classList.remove('active');
    }
    function openToc() {
      if (!shareLeft.classList.contains('hidden') && !_tocTransitioning) return;
      // Clean up any in-progress close transition

    function closeToc() {

    // ── TOC toggle ──

    // ── Markdown renderer ──
    var md = window.markdownit({ html: true, linkify: true, typographer: true, breaks: true });
    md.use(window.markdownitContainer, 'note');
    md.use(window.markdownitContainer, 'warning');
    md.use(window.markdownitContainer, 'tip');
    md.use(window.markdownitEmoji);
    md.use(window.markdownitFootnote);
    md.use(window.markdownitTaskLists, { enabled: true, label: true, labelAfter: true });

    // Rewrite relative image paths → share asset endpoint
    var _shareRoot = '', _shareFile = '';
    md.renderer.rules.image = function(tokens, idx) {
      var token = tokens[idx];
      var src = token.attrGet('src') || '';
      var alt = token.content || '';
      var title = token.attrGet('title') || '';
      if (!/^https?:\/\//i.test(src) && !src.startsWith('/')) {
        var dir = _shareFile.includes('/') ? _shareFile.split('/').slice(0, -1).join('/') : '';
        var full = dir ? dir + '/' + src : src;
        src = API_BASE + '/share/' + TOKEN + '/asset?root=' + encodeURIComponent(_shareRoot) + '&path=' + encodeURIComponent(full);
      }
      return '<img src="' + src + '" alt="' + (alt || '') + '"' + (title ? ' title="' + title + '"' : '') + ' onerror="this.style.display=\'none\'">';
    };

    md.renderer.rules.fence = function(tokens, idx) {
      var token = tokens[idx];
      var language = token.info.trim();
      var raw = token.content;
      if (language === 'mermaid') {
        var id = mermaidStore.length;
        mermaidStore.push(raw);
        return '<div class="mermaid" data-mermaid-id="' + id + '"></div>';
      }
      var cls = language ? 'language-' + language : '';
      if (language) {
        try {
          var langMap = { yml:'yaml', node:'javascript', py:'python', sh:'bash', markdown:'md', text:'plaintext' };
          var nl = langMap[language.toLowerCase()] || language;
          if (window.hljs && window.hljs.getLanguage && window.hljs.getLanguage(nl)) {
            return '<pre><code class="' + cls + '">' + window.hljs.highlight(raw.replace(/<[^>]*>/g, ''), { language: nl, ignoreIllegals: true }).value + '</code></pre>';
          }
        } catch(e) {}
      }
      return '<pre><code class="' + cls + '">' + md.utils.escapeHtml(raw) + '</code></pre>';
    };

    // Rewrite relative markdown links to ClawMate preview URLs
    var _defaultLinkOpen = md.renderer.rules.link_open || function(tokens, idx, options, env, slf) {
      return slf.renderToken(tokens, idx, options);
    };
    md.renderer.rules.link_open = function(tokens, idx, options, env, slf) {
      var token = tokens[idx];
      var href = token.attrGet('href') || '';
      if (href && !/^https?:\/\//i.test(href) && !href.startsWith('/') && !href.startsWith('#')) {
        var dir = (_shareFile || '').includes('/') ? _shareFile.split('/').slice(0, -1).join('/') : '';
        var fullPath = dir ? dir + '/' + href : href;
        href = 'preview.html?root=' + encodeURIComponent(_shareRoot) + '&file=' + encodeURIComponent(fullPath);
        token.attrSet('href', href);
      }
      return _defaultLinkOpen(tokens, idx, options, env, slf);
    };

    function buildTOC(mdDiv) {
      var headings = mdDiv.querySelectorAll('h1,h2,h3,h4');
      if (headings.length < 2) {

        return;
      }
      // Keep hidden by default on mobile
      if (window.innerWidth >= 768) {
        openToc();
        tocBtn.classList.add('active');
      }
      headings.forEach(function(heading, i) { if (!heading.id) heading.id = 'share-h-' + i; });
      var list = document.createElement('ul');
      list.className = 'share-toc-list';
      headings.forEach(function(heading) {
        var level = parseInt(heading.tagName[1]);
        var li = document.createElement('li');
        li.className = 'share-toc-item toc-h' + level;
        var a = document.createElement('a');
        a.href = '#' + heading.id;
        a.textContent = heading.textContent;
        a.addEventListener('click', function(ev) {
          ev.preventDefault();
          if (window.innerWidth < 768) { hideTocInstant(); }
          var ct = document.getElementById('contentBody');
          var hTop = heading.getBoundingClientRect().top;
          var cTop = ct.getBoundingClientRect().top;
          ct.scrollTo({ top: hTop - cTop + ct.scrollTop - 20, behavior: 'smooth' });
        });
        li.appendChild(a);
        list.appendChild(li);
      });
      tocBody.innerHTML = ''; tocBody.appendChild(list);

      // Active highlight via IntersectionObserver (one observer for all)
      if (typeof IntersectionObserver !== 'undefined' && headings.length) {
        var links = list.querySelectorAll('a');
        var activeLink = null;
        var observer = new IntersectionObserver(function(entries) {
          var visible = entries.filter(function(e) { return e.isIntersecting; })
            .sort(function(a, b) { return a.boundingClientRect.top - b.boundingClientRect.top; });
          if (visible.length) {
            var link = list.querySelector('a[href="#' + visible[0].target.id + '"]');
            if (link && link !== activeLink) {
              if (activeLink) activeLink.classList.remove('toc-active');
              link.classList.add('toc-active');
              activeLink = link;
            }
          }
        }, { rootMargin: '-10% 0px -80% 0px', threshold: 0 });
        headings.forEach(function(heading) { observer.observe(heading); });
      }
    }

    function renderMarkdown(content) {
      var html = md.render(content);
      body.innerHTML = '<div class="markdown-body">' + html + '</div>';
      var mdDiv = body.querySelector('.markdown-body');

      if (window.mermaid && mermaidStore.length) {
        try {
          var blocks = mdDiv.querySelectorAll('.mermaid');
          blocks.forEach(function(b) {
            var id = b.getAttribute('data-mermaid-id');
            if (id != null && mermaidStore[id]) b.textContent = mermaidStore[id];
          });
          window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: (window._topbarResolvedTheme && window._topbarResolvedTheme()) === 'dark' ? 'dark' : 'default' });
          window.mermaid.run({ querySelector: '.share-center .mermaid' }).catch(function(){});
        } catch(e) {}
      }
      if (window.renderMathInElement) {
        try { renderMathInElement(mdDiv, { delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}] }); } catch(e) {}
      }
      if (window.hljs && window.hljs.highlightElement) {
        mdDiv.querySelectorAll('pre code:not(.hljs)').forEach(function(b) { try { window.hljs.highlightElement(b); } catch(e) {} });
      }
      mdDiv.querySelectorAll('a[href^="http"]').forEach(function(a) {
        a.setAttribute('target', '_blank'); a.setAttribute('rel', 'noopener');
      });
      // Internal ClawMate links stay in same tab
      mdDiv.querySelectorAll('a[href*="preview.html?root="]').forEach(function(a) {
        a.setAttribute('target', '_self');
      });
    }

    function renderPlainText(content) {
      var pre = document.createElement('pre');
      pre.style.cssText = 'margin:0;padding:16px;overflow-x:auto;font-size:14px;white-space:pre-wrap;word-break:break-word;border-radius:8px;background:var(--bg-code);color:var(--text-primary);';
      pre.textContent = content;
      body.innerHTML = ''; body.appendChild(pre);
    }

    // ── Feedback panel (share surface) ───────────────────────────────
    // Public share has feedback only: add a selection, then submit. It
    // deliberately exposes no review/task/file-tree API or controls. The
    // panel mirrors the review panel: 3-row layout, editable cards with
    // 定位/建议/操作, and a selection tooltip with 加入待办 / 提交评审.
    var shareRight = document.getElementById('shareRight');
    var shareFbCardList = document.getElementById('shareFbCardList');
    var shareFbStatusEl = document.getElementById('shareFbStatus');
    var shareSelTooltip = document.getElementById('shareSelTooltip');
    var shareSelLocation = document.getElementById('shareSelLocation');
    var shareSelTags = document.getElementById('shareSelTags');
    var shareSelNote = document.getElementById('shareSelNote');
    var shareSelStatus = document.getElementById('shareSelStatus');
    var sharePending = [];   // { id, position, text, note, action, scope }
    var shareSubmitted = []; // same shape, submitted/已提交
    var _shareFbId = 0;
    var shareFbFilter = 'pending';

    // `position` is canonical; render legacy `location` records as a
    // compatibility fallback and submit only the normalized position value.
    function _sharePosition(item) {
      if (!item) return '';
      return String(item.position || item.location || '').trim();
    }
    // Keep share history timestamps identical to the review panel.
    function _shareFeedbackCardTime(item) {
      var value = String(item && (item.updated || item.created) || '');
      var match = value.match(/(?:^\d{4}-)?(\d{2})-(\d{2})[T\s](\d{2}):(\d{2})/);
      return match ? match[1] + '-' + match[2] + ' ' + match[3] + ':' + match[4] : value;
    }
    // Drafts are strictly local. Include both capability token and shared
    // file so another share surface cannot restore them.
    function _sharePendingStorageKey() {
      return 'clawmate.share-pending.v1:' + TOKEN + ':' + (_shareFile || '');
    }
    function _sharePersistPending() {
      try { localStorage.setItem(_sharePendingStorageKey(), JSON.stringify(sharePending)); } catch (e) {}
    }
    function _shareRestorePending() {
      try {
        var saved = JSON.parse(localStorage.getItem(_sharePendingStorageKey()) || '[]');
        sharePending = Array.isArray(saved) ? saved : [];
        sharePending.forEach(function(item) {
          _shareFbId = Math.max(_shareFbId, Number(String(item.id || '').replace(/^FD-/, '')) || 0);
        });
      } catch (e) { sharePending = []; }
    }
    // Delegate automatic anchors to preview-common.js, the review-page contract.
    function _shareSelectionLocation(text, range) {
      var ext = (_shareFile || '').split('.').pop().toLowerCase();
      return ClawMateFeedbackPanel.selectionPosition({
        ext: ext, text: text, rawContent: _shareRawContent, range: range,
        markdownRendered: ['md','markdown','rmd','mdx'].includes(ext),
        htmlRendered: ['html','htm'].includes(ext),
        renderedRoot: body.querySelector('.markdown-body')
      });
    }
    var _shareAuthor = '';
    var _shareSelSavedText = '';
    var _shareRawContent = '';

    // Action templates loaded dynamically from /api/clawmate/config (matches the
    // review panel). Selection actions only, tooltip/panel-enabled.
    var _shareTemplates = [];
    function _shareSelectionTemplates() {
      return getSelectionActionTemplates(_shareTemplates, _shareFile);
    }
    // Load once on init.
    function _shareLoadTemplates() {
      return fetch(API_BASE + '/config')
        .then(function(r){ return r.json(); })
        .then(function(d){ if (d && d.task_templates) _shareTemplates = d.task_templates; })
        .catch(function(){ _shareTemplates = []; });
    }

    function _shareEsc(s) { var d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }
    function _shareFbStatus(msg, ok) { shareFbStatusEl.textContent = msg || ''; shareFbStatusEl.className = 'share-fb-status' + (ok ? ' ok' : msg ? ' err' : ''); }
    function _shareSelRenderStatus(msg, ok) { shareSelStatus.textContent = msg || ''; shareSelStatus.className = 'pst-status' + (ok ? ' pst-status-ok' : msg ? ' pst-status-error' : ''); }
    function _shareGetSelection() {
      var sel = window.getSelection ? window.getSelection().toString() : '';
      return String(sel || '').trim();
    }
    function _shareActiveFilter() {
      var btns = shareRight.querySelectorAll('[data-share-filter]');
      btns.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-share-filter') === shareFbFilter); });
    }
    function _shareStatusLabel(status) {
      return ({pending_review:'已提交', approved:'已评审', rejected:'已拒绝', planned:'已计划', in_progress:'处理中', executed:'已执行', failed:'失败'})[status] || status || '已提交';
    }

    // Feedback card: reuses the shared fb-card components so it matches the
    // review panel exactly (时间/定位/选中内容/建议/动作). Delete uses fb-btn-delete.
    // 待提交 = editable; 已提交 = read-only (backend pending_review).
    // Card DOM details (fb-card-completed, if (!isReadOnly), if (isReadOnly),
    // '定位：' + (_sharePosition(it) || '—'), time.textContent =
    // time.textContent = _shareFeedbackCardTime(it); _shareStatusLabel(it.status)) live in
    // feedback-panel.js; its canonical payload is position: _sharePosition(it)
    // with scope: it.scope || 'document' and task_id: it.task_id || ''. This
    // adapter retains only share capability handling.
    function _shareBuildCard(it) {
      var isReadOnly = (shareFbFilter === 'submitted'); // 已提交 only-read card
      return ClawMateFeedbackPanel.buildCard({
        item: it, readOnly: isReadOnly, templates: _shareTemplates, file: _shareFile,
        persist: _sharePersistPending,
        statusLabel: function(status, readOnly) { return readOnly ? _shareStatusLabel(status) : '待提交'; },
        actionLabel: function(action) {
          var match = _shareSelectionTemplates().find(function(template) { return template.action === action; });
          return match ? match.label : ({replace: '📈 替换'})[action] || '—';
        },
        onAction: _shareRender,
        onDelete: function(item) {
          if (shareFbFilter === 'pending') { sharePending = sharePending.filter(function(current) { return current.id !== item.id; }); _sharePersistPending(); _shareRender(); return; }
          fetch(API_BASE + '/share/' + TOKEN + '/feedback/delete', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:item.id})})
            .then(function(response) { if (!response.ok) throw new Error('删除失败'); shareSubmitted = shareSubmitted.filter(function(current) { return current.id !== item.id; }); _shareRender(); })
            .catch(function() { _shareFbStatus('❌ 删除失败', false); });
        },
        buttons: function(item, actions, readOnly) {
          if (readOnly) return;
          var submit = document.createElement('button'); submit.className = 'preview-bottom-btn'; submit.textContent = '提交评审';
          submit.addEventListener('click', function(e) {
            e.stopPropagation();
            if (submit.disabled) return;
            if (!item.note || !item.note.trim()) { _shareFbStatus('请填写建议（必填）', false); return; }
            if (!item.text || !item.text.trim()) { _shareFbStatus('请填写选中内容', false); return; }
            if (!item.action) { item.action = 'modify'; item.scope = 'document'; }
            submit.disabled = true; _shareSubmitPending([item]).finally(function() { submit.disabled = false; });
          });
          actions.appendChild(submit);
        }
      });

    }

    function _shareRender() {
      shareFbCardList.innerHTML = '';
      var source = (shareFbFilter === 'pending' ? sharePending : shareSubmitted).slice()
        .sort(function(a, b) { return String(b.updated || b.created || '').localeCompare(String(a.updated || a.created || '')); });
      if (!source.length) {
        var empty = document.createElement('div');
        empty.className = 'fb-empty';
        empty.textContent = shareFbFilter === 'pending' ? '选中内容后点击浮窗「加入待办」即可累积' : '暂无已提交反馈';
        shareFbCardList.appendChild(empty);
      }
      source.forEach(function(it) { shareFbCardList.appendChild(_shareBuildCard(it)); });
      _shareActiveFilter();
      // 提交评审 only in 待提交 (已提交 is read-only)
      var submitBtn = document.getElementById('shareFbSubmit');
      if (submitBtn) submitBtn.classList.toggle('hidden', shareFbFilter !== 'pending');
    }

    function syncShareFeedbackButton() {
      var btn = document.getElementById('btnShareFeedback');

      btn.setAttribute('aria-pressed', String(isOpen));
      btn.title = isOpen ? '关闭反馈' : '打开反馈';
    }
    function openShareFeedback() { shareRight.classList.remove('hidden'); shareRight.classList.add('open'); updateGrid(); syncShareFeedbackButton(); }
    function closeShareFeedback() { shareRight.classList.add('hidden'); shareRight.classList.remove('open'); updateGrid(); syncShareFeedbackButton(); }
    function toggleShareFeedback() {
      if (shareRight.classList.contains('hidden')) openShareFeedback();

    document.getElementById('btnShareFeedback').addEventListener('click', toggleShareFeedback);
    document.getElementById('shareFbClose').addEventListener('click', closeShareFeedback);

    document.getElementById('shareScrim').addEventListener('click', function() {

      closeShareFeedback();

    // Filter
    shareRight.querySelectorAll('[data-share-filter]').forEach(function(b) {
      b.addEventListener('click', function() { shareFbFilter = b.getAttribute('data-share-filter'); _shareRender(); });
    });

    // 加入待办 (tooltip) → pending card
    document.getElementById('shareSelAdd').addEventListener('click', function() {
      var sel = _shareSelSavedText;
      var note = shareSelNote.value.trim();
      if (!sel) { _shareSelRenderStatus('请先选中内容', false); return; }
      var action = _shareSelAction();
      var _addErr = ClawMateFeedbackPanel.validateSubmission([{ text: sel, note: note, action: action }], { requireAction: true });
      if (_addErr) { _shareSelRenderStatus(_addErr, false); if (_addErr === '请填写建议') shareSelNote.focus(); return; }
      var location = _shareSelectionLocation(sel, _shareSelRange);
      sharePending.push({ id: 'FD-' + (++_shareFbId), created: new Date().toISOString(), position: shareSelLocation.value.trim() || location.position, text: sel, note: note, action: action, scope: _shareSelScope(), task_id: _shareSelTaskId() });
      _sharePersistPending();

      if (_sendErr) { _shareSelRenderStatus(_sendErr, false); if (_sendErr === '请填写建议') shareSelNote.focus(); return; }
      var location = _shareSelectionLocation(sel, _shareSelRange);
      var item = { id: 'FD-' + (++_shareFbId), created: new Date().toISOString(), position: shareSelLocation.value.trim() || location.position, text: sel, note: note, action: action, scope: _shareSelScope(), task_id: _shareSelTaskId() };
      _shareSelNoteReset();
      shareSelTooltip.classList.add('hidden');

    // Toolbar drafts follow the review panel: create a local editable card
    // immediately.  Selections keep their existing canonical line anchor;
    // manual file types receive the same editable Page/Range/Time/Area values
    // used by the floating anchor workflow.
    function _shareAddPendingDraft(text, location) {
      location = location || {};
      sharePending.push({
        id: 'FD-' + (++_shareFbId), created: new Date().toISOString(),
        position: location.position || '', text: String(text || ''),
        note: '', action: '', scope: 'document', task_id: ''

    // 面板「添加反馈」→ create an editable pending card, like the review page.
    document.getElementById('shareFbAdd').addEventListener('click', function(e) {
      if (e) e.stopPropagation();
      var ext = (_shareFile || '').split('.').pop().toLowerCase();
      var text = _shareGetSelection();
      var location = text ? _shareSelectionLocation(text, _shareSelRange) : { position: '' };
      if (['pdf','doc','docx','ppt','pptx','odt','odp'].includes(ext)) {

      }

    });

    async function _shareSubmitPending(list, options) {
      options = options || {};
      var btn = document.getElementById('shareFbSubmit'); if (btn) btn.disabled = true;
      _shareFbStatus('提交中...', false);
      try {
        var payload = ClawMateFeedbackPanel.submissionPayload(list, _shareAuthor);
        var response = await fetch(API_BASE + '/share/' + TOKEN + '/feedback', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
        var data = await response.json();
        if (!response.ok) throw new Error(data.detail || '提交失败');
        var ids = data.ids || [];
        // Move the submitted items from pending → submitted. The item may have
        // come directly from the tooltip (提交评审) without being in sharePending,
        // so base the move on `list` itself (matched by id), then drop from pending.
        var pendingIds = new Set(list.map(function(it){ return it.id; }));
        var submittedItems = list.map(function(it, idx) {
          var c = Object.assign({}, it);
          c.id = ids[idx] || it.id;
          if (!c.created) c.created = new Date().toISOString();
          c.status = 'pending_review';
          c.updated = c.updated || c.created;
          return c;
        });
        shareSubmitted = shareSubmitted.concat(submittedItems);
        sharePending = sharePending.filter(function(it){ return !pendingIds.has(it.id); });
        _sharePersistPending();
        shareFbFilter = 'submitted';
        _shareRender();
        _shareFbStatus('✅ 已提交评审（' + list.length + ' 条）', true);
        // Submission refreshes the filter, but never changes panel visibility.
        // The header button state therefore remains an exact reflection of it.
        syncShareFeedbackButton();
      } catch (err) {
        _shareFbStatus('❌ ' + err.message, false);
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    // Selection tooltip logic (mirror review-panel text selection). Actions come
    // from task_templates dynamically (same source as the review panel).
    function _shareInitTags() {
      shareSelTags.innerHTML = '';
      var opts = _shareSelectionTemplates();
      opts.forEach(function(t){
        var b = document.createElement('button'); b.className = 'pst-tag'; b.textContent = t.label; b.setAttribute('data-action', t.action); b.setAttribute('data-scope', t.scope||'document'); b.setAttribute('data-task-id', t.id || 'review_' + t.action);
        b.addEventListener('click', function(){
          shareSelTags.querySelectorAll('.pst-tag').forEach(function(x){ x.classList.remove('active'); });
          b.classList.add('active');
          shareSelNote.focus();
        });
        shareSelTags.appendChild(b);
      });
    }
    function _shareSelAction() {
      var a = shareSelTags.querySelector('.pst-tag.active');
      return a ? (a.getAttribute('data-action') || '') : '';
    }
    function _shareSelScope() {
      var a = shareSelTags.querySelector('.pst-tag.active');
      return a ? (a.getAttribute('data-scope') || 'document') : 'document';
    }
    function _shareSelTaskId() {
      var a = shareSelTags.querySelector('.pst-tag.active');
      return a ? (a.getAttribute('data-task-id') || '') : '';
    }
    var _shareSelRange = null;
    function _shareSelNoteReset() { shareSelNote.value = ''; if (shareSelLocation) shareSelLocation.value = ''; _shareSelRenderStatus(''); }
    function _handleShareSelection() {
      var sel = _shareGetSelection();
      if (!sel) { shareSelTooltip.classList.add('hidden'); return; }
      // A delayed selectionchange can arrive after an action-tag click. Keep
      // the current action/note for the same visible selection; reset only for
      // a distinct selection or when reopening the floating card.
      var isNewSelection = sel !== _shareSelSavedText || shareSelTooltip.classList.contains('hidden');
      _shareSelSavedText = sel;
      if (isNewSelection) { _shareSelNoteReset(); _shareInitTags(); }
      var rect = null;
      try { var s = window.getSelection(); if (s.rangeCount) { _shareSelRange = s.getRangeAt(0).cloneRange(); rect = _shareSelRange.getBoundingClientRect(); } } catch(e){}
      var anchor = _shareSelectionLocation(sel, _shareSelRange);
      shareSelLocation.placeholder = getFeedbackPositionPlaceholder((_shareFile || '').split('.').pop());
      shareSelLocation.value = anchor.position;
      if (rect) {
        var top = rect.bottom + 8;
        var left = rect.left + rect.width/2;
        shareSelTooltip.style.maxWidth = Math.min(400, window.innerWidth - 20) + 'px';
        shareSelTooltip.classList.remove('hidden');
        requestAnimationFrame(function(){
          var h = shareSelTooltip.offsetHeight, w = shareSelTooltip.offsetWidth;
          if (top + h > window.innerHeight - 10) top = rect.top - h - 8;
          left = Math.max(10 + w/2, Math.min(window.innerWidth - 10 - w/2, left));
          shareSelTooltip.style.top = top + 'px';
          shareSelTooltip.style.left = left + 'px';
          shareSelTooltip.style.transform = 'translateX(-50%)';
        });
      } else {
        shareSelTooltip.classList.remove('hidden');
        shareSelTooltip.style.top = '80px'; shareSelTooltip.style.left = '50%';
        shareSelTooltip.style.transform = 'translateX(-50%)';
      }
    }
    function _shareOnSelection() {
      var sel = _shareGetSelection();
      if (sel) setTimeout(_handleShareSelection, 10);
      else hideShareTooltip();
    }
    // Non-text previews have no browser selection layer. Reuse the same card
    // and canonical formats, with a file label as the required feedback text.
    function _shareOpenManualAnchor(text, position) {
      _shareSelRange = null;
      _shareSelSavedText = text;
      _shareSelNoteReset(); _shareInitTags();
      shareSelLocation.placeholder = getFeedbackPositionPlaceholder((_shareFile || '').split('.').pop());
      shareSelLocation.value = position;
      shareSelTooltip.classList.remove('hidden');
      shareSelTooltip.style.top = '80px'; shareSelTooltip.style.left = '50%';
      shareSelTooltip.style.transform = 'translateX(-50%)';
    }
    function _shareBindVisualAnchors(ext) {
      var image = body.querySelector('img');
      if (image) image.addEventListener('click', function(e) {
        e.stopPropagation();
        var rect = image.getBoundingClientRect();
        _shareOpenManualAnchor('[' + _shareFile + ']', 'Area [' + Math.round(e.clientX - rect.left) + ',' + Math.round(e.clientY - rect.top) + ']x0');
      });
      var media = body.querySelector('audio,video');
      if (media) media.addEventListener('click', function(e) {
        e.stopPropagation();
        _shareOpenManualAnchor('[' + _shareFile + ']', 'Time ' + formatFeedbackTime(media.currentTime));
      });
    }
    function hideShareTooltip() { shareSelTooltip.classList.add('hidden'); }
    // Show floating card on mouseup if there is a real selection. We read the
    // selection synchronously in the same handler so it is still alive.
    document.addEventListener('mouseup', function(e) {
      var sel = _shareGetSelection();
      if (sel) { _handleShareSelection(); }
      else if (!shareSelTooltip.contains(e.target)) { hideShareTooltip(); }
    });
    // Debounced selectionchange fallback that only shows when a stable non-empty
    // selection exists; never fires a hide on its own (avoid hiding right after show).
    var _selTimer = null;
    document.addEventListener('selectionchange', function() {
      var sel = _shareGetSelection();
      if (sel && !shareSelTooltip.contains(document.activeElement)) {
        if (_selTimer) clearTimeout(_selTimer);
        _selTimer = setTimeout(_handleShareSelection, 120);
      }
    });
    // Explicit clicks outside the tooltip clear it only when nothing is selected.
    document.addEventListener('click', function(e) {
      if (shareSelTooltip.contains(e.target)) return;
      if (!_shareGetSelection() && !_shareSelSavedText) hideShareTooltip();
    });
    shareSelTooltip.addEventListener('click', function(e){ e.stopPropagation(); });

    // Author field (optional, local session)
    (function() {
      var v = '';
      try { v = (localStorage.getItem('clawmate-share-author') || '').trim(); } catch (e) {}
      _shareAuthor = v;
    })();

    // Load action templates first, then render (actions shared with review panel).
    _shareLoadTemplates().then(_shareRender);

    async function _shareLoadSubmitted() {
      var response = await fetch(API_BASE + '/share/' + TOKEN + '/feedback');
      if (!response.ok) throw new Error('加载历史反馈失败 (' + response.status + ')');
      var data = await response.json();
      shareSubmitted = (data.items || []).map(function(item) {
        return {
          id: item.id || '', status: item.status || '', created: item.created || '', updated: item.updated || '',
          action: item.action || '', scope: item.scope || '', task_id: item.task_id || '',
          text: item.content || '', note: item.note || '', position: _sharePosition(item)
        };
      });
      _shareRender();
    }

    async function loadContent() {
      try {
        var res = await fetch(API_BASE + '/share/' + TOKEN + '/data');
        if (!res.ok) {
          body.innerHTML = '<div class="share-error"><strong>' + (res.status === 410 ? '链接已过期' : '无法加载分享内容') + '</strong>请向发送者索取新的分享链接。</div>';
          return;
        }
        var data = await res.json();
        // Store root/file for image path rewriting
        _shareRoot = data.root || '';
        _shareFile = data.path || '';
        _shareRawContent = data.content || '';
        _shareRestorePending();
        await _shareLoadSubmitted();
        document.getElementById('shareExpiry').textContent = data.expires_str ? '⏳ ' + data.expires_str + ' 前有效' : '⏳ -';

        var ext = data.suffix ? data.suffix.replace('.','').toLowerCase() : '';
        var pageTitle = data.name;
        if ((ext === 'md' || ext === 'markdown') && data.content) {
          var m = data.content.match(/^#\s+(.+)$/m);
          if (m) pageTitle = m[1].trim();
        }
        document.title = pageTitle + ' · ClawMate 分享';
        document.getElementById('shareTitle').textContent = pageTitle;

        var IMG = ['png','jpg','jpeg','svg','webp','gif','bmp','ico'];
        var AUD = ['mp3','wav','ogg','flac','aac','m4a','wma'];
        var VID = ['mp4','webm','mov','avi','mkv','wmv','flv','m4v'];
        var DOC = ['doc','docx','xls','xlsx','ppt','pptx','odt','ods','odp','pdf'];

        if (IMG.includes(ext)) {
          hideTocInstant();
          body.innerHTML = '<div class="share-media"><div class="share-media-title">' + data.name + '</div><img src="' + API_BASE + '/share/' + TOKEN + '/raw" alt="' + data.name + '" /></div>';
        } else if (AUD.includes(ext)) {
          hideTocInstant();
          body.innerHTML = '<div class="share-media"><div class="share-media-title">' + data.name + '</div><audio src="' + API_BASE + '/share/' + TOKEN + '/raw" controls preload="metadata" style="width:100%;max-width:600px;"></audio></div>';
        } else if (VID.includes(ext)) {
          hideTocInstant();
          body.innerHTML = '<div class="share-media"><div class="share-media-title">' + data.name + '</div><video src="' + API_BASE + '/share/' + TOKEN + '/raw" controls preload="metadata" style="width:100%;max-height:60vh;border-radius:8px;background:#000;"></video></div>';
        } else if (DOC.includes(ext)) {
          hideTocInstant();
          body.innerHTML = '<div class="share-media" style="gap:16px;"><div style="font-size:48px;opacity:0.5;">📄</div><div class="share-media-title">' + data.name + '</div><div style="font-size:13px;color:var(--text-muted);">桌面版可预览 Office/PDF 文件</div></div>';
        } else if (ext === 'md' || ext === 'markdown') {
          renderMarkdown(data.content || '');
        } else if (ext === 'html' || ext === 'htm') {
          hideTocInstant();
          var iframe = document.createElement('iframe');
          iframe.style.cssText = 'width:100%;height:100%;border:none;background:#fff;';
          iframe.srcdoc = data.content || '';
          body.innerHTML = '';
          body.appendChild(iframe);
        } else {
          hideTocInstant();
          renderPlainText(data.content || '');
        }
        _shareBindVisualAnchors(ext);
      } catch(e) {
        body.innerHTML = '<div class="share-error"><strong>无法加载分享内容</strong>请向发送者索取新的分享链接。</div>';
      }
    }
    syncShareFeedbackButton();
    updateGrid();   // apply content-first columns on init (avoids a stale grid gutter)
    window.addEventListener('resize', updateGrid);
    loadContent();
  })();
  </script>
</body>
</html>
